name: New regional catalog
description: Propose or request a material catalog for your country
labels: [catalog]
body:
  - type: input
    id: region
    attributes: {label: Country / region, placeholder: "e.g. Portugal (pt)"}
    validations: {required: true}
  - type: textarea
    id: materials
    attributes:
      label: Materials and sizes
      description: Sheet sizes, thicknesses, profile and bar lengths sold locally, with the source of each (shop, link). Mark anything not confirmed.
    validations: {required: true}
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options: [{label: "I can open a pull request with catalog/<code>.json"}]
