name: Platform test report
description: Results of /kit-test on your computer
labels: [test-report]
body:
  - type: input
    id: platform
    attributes: {label: Platform, placeholder: "e.g. Ubuntu 24.04 Wayland, FreeCAD Flatpak 1.1.4"}
    validations: {required: true}
  - type: textarea
    id: report
    attributes:
      label: REPORT.md
      description: Paste projects/_selftest/REPORT.md, then attach the selftest-<os>-<date>.zip below.
      render: markdown
    validations: {required: true}
  - type: textarea
    id: notes
    attributes: {label: Anything else (manual steps, what was confusing)}
