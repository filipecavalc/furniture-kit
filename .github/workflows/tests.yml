# Unit tests of the library's pure logic (names, sections, nesting, cut-list summary) and of the
# material catalogs. The tested code has nothing OS-specific, so one job is enough: Windows, the
# maintainer's main platform, and Python 3.11, the version bundled with FreeCAD 1.1 there.
# This is not a platform test. FreeCAD, Blender and the self-test stay manual (see TESTING.md).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest
