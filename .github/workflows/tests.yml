# Unit tests of the library's pure logic (names, sections, nesting, cut-list summary).
# FreeCAD is not installed here: the self-test inside FreeCAD stays a manual step (see TESTING.md).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
